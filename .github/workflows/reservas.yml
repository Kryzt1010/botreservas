name: reservas

on:
  workflow_dispatch:
  schedule:
    - cron: '7 16 * * 0,2,4'
    - cron: '10 17 * * 0,2,4'
    
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        run: python bot-reservas.py
