name: reservas
on:
  workflow_dispatch:
  schedule:
     - cron: "17 20 * * 0,2,4"
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot-reservas.py
